  <script>
    // ── PHOTO COUNT ──
    const items = document.querySelectorAll('.gallery-item');
    document.getElementById('photo-count').textContent = items.length + ' FOTO';

    // ── LIGHTBOX ──
    const images   = [...document.querySelectorAll('.gallery-item img')];
    const lightbox = document.getElementById('lightbox');
    const lbImg    = document.getElementById('lightbox-img');
    const lbCap    = document.getElementById('lightbox-caption');
    const lbCount  = document.getElementById('lightbox-counter');
    let current    = 0;

    function openLightbox(index) {
      current = index;
      lbImg.src = images[index].src;
      lbCount.textContent = (index + 1) + ' / ' + images.length;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    function prevImg() {
      current = (current - 1 + images.length) % images.length;
      openLightbox(current);
    }

    function nextImg() {
      current = (current + 1) % images.length;
      openLightbox(current);
    }

    // Klik foto buka lightbox
    images.forEach((img, i) => {
      img.closest('.gallery-item').addEventListener('click', () => openLightbox(i));
    });

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-prev').addEventListener('click', prevImg);
    document.getElementById('lightbox-next').addEventListener('click', nextImg);

    // Klik di luar foto nutup lightbox
    lightbox.addEventListener('click', e => {
      if (e.target === lightbox) closeLightbox();
    });

    // Keyboard navigation
    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'ArrowLeft')  prevImg();
      if (e.key === 'ArrowRight') nextImg();
      if (e.key === 'Escape')     closeLightbox();
    });

    // ── HAMBURGER ──
    const hamburger = document.getElementById('hamburger');
    const navLinks  = document.querySelector('.nav-links');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      navLinks.classList.toggle('open');
    });
  </script>
